{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        
        <!-- Окно входа, если кассир ещё не ввёл пароль -->
        {% if not logged_in %}
        <div class="card p-4 card-food">
            <h3 class="text-center mb-3">🔐 Вход в панель кассира</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" name="login_button" class="btn btn-success w-100">Войти</button>
            </form>
        </div>
        
        <!-- Панель изменения количества, если кассир успешно вошел -->
        {% else %}
        <div class="card p-4 card-food">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">⚙️ Управление меню</h3>
                <a href="/logout" class="btn btn-danger btn-sm">Выйти</a>
            </div>
            
            <form method="POST">
                {% for id, name, count, price in menu %}
                <div class="mb-3 row align-items-center">
                    <label class="col-6 col-form-label fw-bold">{{ name }} ({{ price }}₽):</label>
                    <div class="col-6">
                        <input type="number" name="count_{{ id }}" value="{{ count }}" min="0" class="form-control text-center">
                    </div>
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100 mt-3">💾 Сохранить изменения</button>
            </form>
        </div>
        {% endif %}

    </div>
</div>
{% endblock %}
